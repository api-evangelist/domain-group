aid: domain-group
url: https://raw.githubusercontent.com/api-evangelist/domain-group/refs/heads/main/apis.yml
name: Domain Group
kind: company
description: 'Domain Group (Domain Holdings Australia Ltd, trading as domain.com.au) is the second of
  Australia''s two national residential property portals, alongside REA Group''s realestate.com.au, and
  since 27 August 2025 has been a wholly owned subsidiary of CoStar Group. Headquartered in Sydney, Domain
  operates the domain.com.au consumer marketplace plus commercial, agent, and developer-project brands,
  and sits in the middle of the Australian value chain between selling and leasing agencies on one side
  and buyers, renters, banks, and PropTech builders on the other. Unlike most of the real estate sector,
  Domain runs a genuine, self-serve public developer portal at developer.domain.com.au: a developer signs
  up with GitHub, Google, or email, creates a project, and is immediately granted the "Agents & Listings"
  and "Properties & Locations" packages, with the remaining eleven packages - Address Suggestions, Campaign
  reporting, Listings Management, Price Estimation, Property Enrichment, Property Package, PropertyRadar,
  Rental AVM, Schools Data, and Webhooks - added per project and negotiated with an account manager. Domain
  publishes three machine-readable OpenAPI 3.0.4 documents (latest, v1, v2) directly from its Libraries
  page, backs them with an OpenID Connect discovery document at auth.domain.com.au, and serves everything
  from api.domain.com.au behind API-key or OAuth 2.0 (client credentials, authorization code, implicit)
  credentials. Write access is a different gate entirely: uploading or updating listings requires sandbox
  sign-off by email to api@domain.com.au and written permission from the principal agent of each agency,
  making listing management broker-authorised even though the read surface is self-serve. Domain carries
  no RESO Web API or RESO Data Dictionary certification, exposes no OData $metadata document and no Universal
  Property Identifier - RESO is a North American NAR-driven standard with no presence in the Australian
  portal duopoly - and it publishes no open, unlicensed dataset; all data is licensed under the Domain
  Group API Terms and Conditions.'
deliveryModel:
  model: saas
  open_source: false
  commercial: true
  callable_host: true
  label: Hosted service · you call their endpoint
