openapi: 3.2.0
info:
  title: Domain Public Agent Search API
  description: See https://developer.domain.com.au for more information
  termsOfService: https://developer.domain.com.au/docs/latest/support/terms
  contact:
    name: Domain Developer Support
    email: api@domain.com.au
  version: latest
servers:
- url: https://api.domain.com.au/
  description: Primary
- url: https://api.domain.com.au/sandbox/
  description: Sandbox
tags:
- name: AgentSearch
paths:
  /v2/agentsearch/agents/location:
    post:
      tags:
      - AgentSearch
      summary: Retrieves agents matching the specified location criteria
      operationId: agent_location_search
      requestBody:
        description: Search parameters
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Agencies.V2.GetAgentsByLocationRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/Agencies.V2.GetAgentsByLocationRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Agencies.V2.GetAgentsByLocationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agencies.V2.AgentSearchPageResultContactStatsDto'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - apikey: []
      - oauth2:
        - api_agencies_read
      x-domain-endpointcost: 1
      x-domain-usercontextrequired: false
      x-domain-environment: Any
