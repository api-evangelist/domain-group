openapi: 3.2.0
info:
  title: Domain Group Agents API
  contact:
    name: Domain Developer Support
    email: api@domain.com.au
  termsOfService: https://developer.domain.com.au/docs/latest/support/terms
  version: '1.0'
  description: 'Operations tagged Agents across 2 of this provider''s published API definitions: domain-group-openapi-latest.json, domain-group-openapi-v1.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.domain.com.au/
  description: Primary
- url: https://api.domain.com.au/sandbox/
  description: Sandbox
tags:
- name: Agents
paths:
  /v1/agents/{id}:
    get:
      tags:
      - Agents
      summary: Retrieves a specific agent details, including contact information.
      operationId: Agents_Get
      parameters:
      - name: id
        in: path
        description: Agent identifier
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agencies.V1.Agent'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - apikey: []
      - oauth2:
        - api_agencies_read
      x-domain-endpointcost: 1
      x-domain-usercontextrequired: false
      x-domain-environment: Any
    servers:
    - url: https://api.domain.com.au/
      description: Primary
    - url: https://api.domain.com.au/sandbox/
      description: Sandbox
  /v1/agents/{id}/listings:
    get:
      tags:
      - Agents
      summary: Gets listing using the contact id
      operationId: Agents_GetListings
      parameters:
      - name: id
        in: path
        description: Id of the agent (contact)
        required: true
        schema:
          type: integer
          format: int32
      - name: dateUpdatedSince
        in: query
        description: Filter to remove listings not updated since before the given date time
        schema:
          type: string
          format: date-time
      - name: includedArchivedListings
        in: query
        description: Filter to remove listings that have been archived
        schema:
          type: boolean
          default: false
      - name: pageNumber
        in: query
        description: Page number for paginated results
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        description: Page size for paginated results
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Listings.V1.Listing'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - apikey: []
      - oauth2:
        - api_listings_read
      x-domain-endpointcost: 1
      x-domain-usercontextrequired: false
      x-domain-environment: Any
    servers:
    - url: https://api.domain.com.au/
      description: Primary
    - url: https://api.domain.com.au/sandbox/
      description: Sandbox
  /v1/agents/{id}/statistics:
    get:
      tags:
      - Agents
      summary: Retrieves stats for the listings of a given agent
      operationId: Agents_GetStatistics
      parameters:
      - name: id
        in: path
        description: Agent identifier
        required: true
        schema:
          type: integer
          format: int32
      - name: timePeriod
        in: query
        description: 'The time period to show statistics for. Valid values are: `last7Days`, `last90Days`, `wholeCampaign`'
        schema:
          enum:
          - last7Days
          - last90Days
          - wholeCampaign
          type: string
          description: Defines StatisticsTimePeriod
          default: last7Days
      - name: statusFilter
        in: query
        description: Listing filter
        schema:
          enum:
          - live
          - liveAndArchived
          type: string
          description: Which listings to filter based on status in lifecycle
          default: liveAndArchived
      - name: channel
        in: query
        description: Filter statistics for the given channel
        schema:
          enum:
          - residential
          - commercial
          - business
          type: string
          description: Channel of the listing
          default: residential
      - name: pageNumber
        in: query
        description: Page number for paginated results
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        description: Page size for paginated results
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListingPerformance.v1.Statistics'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - apikey: []
      - oauth2:
        - api_agencies_read
      x-domain-endpointcost: 1
      x-domain-usercontextrequired: true
      x-domain-environment: Primary
    servers:
    - url: https://api.domain.com.au/
      description: Primary
    - url: https://api.domain.com.au/sandbox/
      description: Sandbox
  /v1/agents/search:
    get:
      tags:
      - Agents
      summary: Search for agents by name.
      description: The returned Agent ID can be used to get an agent details by ID. See `GET /agents/{id}/`
      operationId: Agents_Search
      parameters:
      - name: query
        in: query
        description: The name, or portion of name, to search for.
        required: true
        schema:
          type: string
      - name: pageNumber
        in: query
        description: Page number for paginated results
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: Page size for paginated results (maximum 20)
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Domain.AgentSearch.v1.Model.AutoSuggestAgentResultDto'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Domain.AgentSearch.v1.Model.AutoSuggestAgentResultDto'
            text/html:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Domain.AgentSearch.v1.Model.AutoSuggestAgentResultDto'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Domain.AgentSearch.v1.Model.AutoSuggestAgentResultDto'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Domain.AgentSearch.v1.Model.AutoSuggestAgentResultDto'
      security:
      - apikey: []
      - oauth2:
        - api_agencies_read
      x-domain-usercontextrequired: false
      x-domain-endpointcost: 1
      x-domain-environment: Primary
    servers:
    - url: https://api.domain.com.au/
      description: Primary
    - url: https://api.domain.com.au/sandbox/
      description: Sandbox
components:
  schemas:
    Listings.v1.ComparableData:
      type: object
      properties:
        comparableProperty:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Listings.v1.PastSaleData'
          description: Comparable properties that are of a similar standard or condition to the property for sale
        declarationText:
          type:
          - string
          - 'null'
          description: Text description if there are less than three comparable sales available
      additionalProperties: false
      description: Information regarding the past comparable property sales that influenced the setting of the estimation price
      x-data-access-level-info:
        Basic:
        - '*'
        Detailed:
        - '*'
        Full:
        - '*'
    Listings.V1.Listing:
      required:
      - advertiserIdentifiers
      - id
      - propertyTypes
      type: object
      properties:
        objective:
          enum:
          - sale
          - rent
          type:
          - string
          - 'null'
          description: Gets or Sets Objective
        status:
          enum:
          - unknown
          - archived
          - underOffer
          - sold
          - leased
          - newDevelopment
          - recentlyUpdated
          - new
          - live
          - pending
          - depositTaken
          type:
          - string
          - 'null'
          description: Gets or Sets Status
        saleMode:
          enum:
          - buy
          - rent
          - share
          - sold
          - leased
          - archived
          type:
          - string
          - 'null'
          description: Gets or Sets SaleMode
        channel:
          enum:
          - residential
          - commercial
          - business
          type:
          - string
          - 'null'
          description: Gets or Sets Channel
        id:
          type: integer
          description: The identifier which uniquely identifies the listing.
          format: int32
        addressParts:
          $ref: '#/components/schemas/Listings.V1.AddressParts'
        advertiserIdentifiers:
          $ref: '#/components/schemas/Listings.v1.AdvertiserIdentifiers'
        apmIdentifiers:
          $ref: '#/components/schemas/Listings.V1.AustralianPropertyMonitorsIdentifiers'
        bathrooms:
          type:
          - number
          - 'null'
          description: Total number of bathrooms in the property
          format: float
        bedrooms:
          type:
          - number
          - 'null'
          description: Total number of bedrooms in the property; Studio apartments have a value of \"0\"
          format: float
        buildingArea:
          type:
          - string
          - 'null'
          description: The building area display value of the property e.g. 160 ha
        buildingAreaSqm:
          type:
          - number
          - 'null'
          description: The properties building area in square meters
          format: double
        carspaces:
          type:
          - number
          - 'null'
          description: Total number of car spaces in the property.
          format: float
        dateAvailable:
          type:
          - string
          - 'null'
          description: The date the property is available. DateTime is in a local timezone.
          format: date-time
        dateCreated:
          type:
          - string
          - 'null'
          description: The date/time the listing was created. DateTime is in AEST (Australian Eastern Standard Time) or AEDT (Australian Eastern Daylight Time) timezone.
          format: date-time
        dateUpdated:
          type:
          - string
          - 'null'
          description: The date/time the listing had major update. DateTime is in AEST (Australian Eastern Standard Time) or AEDT (Australian Eastern Daylight Time) timezone.
          format: date-time
        dateMinorUpdated:
          type:
          - string
          - 'null'
          description: When minor update applied to the listing. DateTime is in AEST (Australian Eastern Standard Time) or AEDT (Australian Eastern Daylight Time) timezone.
          format: date-time
        datePurged:
          type:
          - string
          - 'null'
          description: The date/time the listing was purged. It's only returned for archived listings. DateTime is in AEST (Australian Eastern Standard Time) or AEDT (Australian Eastern Daylight Time) timezone.
          format: date-time
        dateListed:
          type:
          - string
          - 'null'
          description: The date/time last listed. DateTime is in AEST (Australian Eastern Standard Time) or AEDT (Australian Eastern Daylight Time) timezone.
          format: date-time
        description:
          type:
          - string
          - 'null'
          description: The long description of the property provided by the advertiser.
        devProjectId:
          type:
          - integer
          - 'null'
          description: The ID of the development project - null if no associated project
          format: int32
        energyEfficiencyRating:
          type:
          - integer
          - 'null'
          description: Energy Efficiency Rating value for ACT properties
          format: int32
        features:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The property features specified by the advertiser
        geoLocation:
          $ref: '#/components/schemas/Listings.v1.GeoLocation'
        headline:
          type:
          - string
          - 'null'
          description: The short description of the property provided by the advertiser.
        inspectionDetails:
          $ref: '#/components/schemas/Listings.v1.PropertyInspections'
        isNewDevelopment:
          type:
          - boolean
          - 'null'
          description: Indicates whether the property is a new development
        landArea:
          type:
          - string
          - 'null'
          description: The land area display string for the property e.g. 160 sqm
        landAreaSqm:
          type:
          - number
          - 'null'
          description: The properties land area in square meters
          format: double
        media:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Listings.v1.ListingMedia'
          description: The media associated with the property provided by the advertiser
        priceDetails:
          $ref: '#/components/schemas/Listings.V1.PriceDetails'
        propertyId:
          type:
          - string
          - 'null'
          description: The identifier which uniquely identifies the property being advertised.  This may be empty if the Address of property is poorly described
