openapi: 3.2.0
info:
  title: Domain Group Campaign Reporting API
  contact:
    name: Domain Developer Support
    email: api@domain.com.au
  termsOfService: https://developer.domain.com.au/docs/latest/support/terms
  version: '1.0'
  description: 'Operations tagged CampaignReporting across 2 of this provider''s published API definitions: domain-group-openapi-latest.json, domain-group-openapi-v1.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.domain.com.au/
  description: Primary
- url: https://api.domain.com.au/sandbox/
  description: Sandbox
tags:
- name: CampaignReporting
paths:
  /v1/campaign/listing-performance:
    get:
      tags:
      - CampaignReporting
      summary: Retrieves listing performance metrics for the New Developer Listings (linked to New Developer Projects) managed by advertisers.
      operationId: Campaign_GetListingPerformance_Report
      parameters:
      - name: listingId
        in: query
        schema:
          type: string
      - name: projectId
        in: query
        schema:
          type: string
      - name: startDate
        in: query
        schema:
          type: string
          format: date
      - name: endDate
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignAPI.v1.ListingPerformanceDataResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CampaignAPI.v1.HttpValidationProblemDetails'
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      security:
      - apikey: []
      - oauth2:
        - api_campaignperformance_read
        - api_listingperformance_read
      x-domain-endpointcost: 1
      x-domain-usercontextrequired: false
      x-domain-environment: Any
    servers:
    - url: https://api.domain.com.au/
      description: Primary
    - url: https://api.domain.com.au/sandbox/
      description: Sandbox
  /v1/campaign/project-performance:
    get:
      tags:
      - CampaignReporting
      summary: Retrieves project performance metrics for the New Developer Projects managed by advertisers.
      operationId: Campaign_GetProjectPerformance_Report
      parameters:
      - name: projectId
        in: query
        schema:
          type: string
      - name: startDate
        in: query
        schema:
          type: string
          format: date
      - name: endDate
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignAPI.v1.ProjectPerformanceDataResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CampaignAPI.v1.HttpValidationProblemDetails'
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      security:
      - apikey: []
      - oauth2:
        - api_campaignperformance_read
        - api_projectperformance_read
      x-domain-endpointcost: 1
      x-domain-usercontextrequired: false
      x-domain-environment: Any
    servers:
    - url: https://api.domain.com.au/
      description: Primary
    - url: https://api.domain.com.au/sandbox/
      description: Sandbox
