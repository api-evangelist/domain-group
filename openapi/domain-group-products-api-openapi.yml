            schema:
              $ref: '#/components/schemas/BookingV2Api.v1.GetListingPriceQuoteByAgencyRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/BookingV2Api.v1.GetListingPriceQuoteByAgencyRequest'
          text/json:
