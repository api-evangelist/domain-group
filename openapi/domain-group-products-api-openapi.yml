  /v1/products/ratefornewlisting:
    post:
      tags:
      - Products
      summary: Get updated pricing information for a hypothetical listing
      operationId: Products_RateForNewListing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Bookings.V2.RateForNewListingRequest'
          text/json:
