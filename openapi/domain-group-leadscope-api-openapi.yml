openapi: 3.2.0
info:
  title: Domain Group Leadscope API
  contact:
    name: Domain Developer Support
    email: api@domain.com.au
  termsOfService: https://developer.domain.com.au/docs/latest/support/terms
  version: '1.0'
  description: 'Operations tagged Leadscope across 2 of this provider''s published API definitions: domain-group-openapi-latest.json, domain-group-openapi-v1.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.domain.com.au/
  description: Primary
- url: https://api.domain.com.au/sandbox/
  description: Sandbox
tags:
- name: Leadscope
paths:
  /v1/leadscope/predictions/{participantId}:
    get:
      tags:
      - Leadscope
      summary: URL to download a list of agency predictions
      operationId: LeadScope_GetById
      parameters:
      - name: participantId
        in: path
        description: Participant ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: URL to download a list of agency predictions
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
        '204':
          description: No predictions found
      security:
      - apikey: []
      - oauth2:
        - api_agencies_read
      x-domain-endpointcost: 1
      x-domain-usercontextrequired: false
      x-domain-environment: Primary
    servers:
    - url: https://api.domain.com.au/
      description: Primary
    - url: https://api.domain.com.au/sandbox/
      description: Sandbox
  /v1/leadminer/predictions/{participantId}:
    get:
      tags:
      - Leadscope
      summary: URL to download a list of agency predictions
      operationId: LeadMiner_GetById
      parameters:
      - name: participantId
        in: path
        description: Participant ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: URL to download a list of agency predictions
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
        '204':
          description: No predictions found
      deprecated: true
      security:
      - apikey: []
      - oauth2:
        - api_agencies_read
      x-domain-endpointcost: 1
      x-domain-usercontextrequired: false
      x-domain-environment: Primary
    servers:
    - url: https://api.domain.com.au/
      description: Primary
    - url: https://api.domain.com.au/sandbox/
      description: Sandbox
