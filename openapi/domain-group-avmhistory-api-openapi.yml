tags:
- name: AvmHistory
paths:
  /v1/avmHistory/{propertyId}:
    get:
      tags:
      - AvmHistory
      summary: Retrieves valuation history for the property
      operationId: AvmHistory_Get
      parameters:
      - name: propertyId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvmHistory.v1.Response'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AvmHistory.v1.HttpValidationProblemDetails'
        '403':
          description: Forbidden
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvmHistory.v1.ProblemDetails'
        '500':
          description: Internal Server Error
      security:
      - apikey: []
      - oauth2:
        - api_avmhistory_read
      x-domain-endpointcost: 1
      x-domain-usercontextrequired: false
      x-domain-environment: Any
    servers:
    - url: https://api.domain.com.au/
      description: Primary
    - url: https://api.domain.com.au/sandbox/
      description: Sandbox
