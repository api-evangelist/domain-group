openapi: 3.2.0
info:
  title: Domain Group Disclaimers API
  contact:
    name: Domain Developer Support
    email: api@domain.com.au
  termsOfService: https://developer.domain.com.au/docs/latest/support/terms
  version: '1.0'
  description: 'Operations tagged Disclaimers across 2 of this provider''s published API definitions: domain-group-openapi-latest.json, domain-group-openapi-v1.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.domain.com.au/
  description: Primary
- url: https://api.domain.com.au/sandbox/
  description: Sandbox
tags:
- name: Disclaimers
paths:
  /v1/disclaimers:
    get:
      tags:
      - Disclaimers
      summary: Disclaimers
      description: Retrieve disclaimers for given ids.
      operationId: Disclaimers_Get
      parameters:
      - name: ids
        in: query
        description: Comma-separated list of IDs. Eg. "APM,NSWVG, VICVG"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Disclaimers data returned
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Unexpected error
      security:
      - apikey: []
      - oauth2:
        - api_properties_read
      x-domain-endpointcost: 1
      x-domain-usercontextrequired: false
      x-domain-environment: Any
    servers:
    - url: https://api.domain.com.au/
      description: Primary
    - url: https://api.domain.com.au/sandbox/
      description: Sandbox
  /v1/disclaimers/product/{product}:
    get:
      tags:
      - Disclaimers
      summary: Disclaimers by Product
      description: Retrieves disclaimers for given product.
      operationId: Disclaimers_GetByProduct
      parameters:
      - name: product
        in: path
        description: 'Product which disclaimers are to be retrieved. Possible values include:

          - PropertyData

          - AURIN

          - HomePriceGuide

          '
        required: true
        schema:
          enum:
          - PropertyData
          - AURIN
          - HomePriceGuide
          type: string
      responses:
        '200':
          description: Disclaimers data returned
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Unexpected error
      security:
      - apikey: []
      - oauth2:
        - api_properties_read
      x-domain-endpointcost: 1
      x-domain-usercontextrequired: false
      x-domain-environment: Any
    servers:
    - url: https://api.domain.com.au/
      description: Primary
    - url: https://api.domain.com.au/sandbox/
      description: Sandbox
