openapi: 3.2.0
info:
  title: Domain Group Webhooks API
  contact:
    name: Domain Developer Support
    email: api@domain.com.au
  termsOfService: https://developer.domain.com.au/docs/latest/support/terms
  version: '1.0'
  description: 'Operations tagged Webhooks across 2 of this provider''s published API definitions: domain-group-openapi-latest.json, domain-group-openapi-v1.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.domain.com.au/
  description: Primary
- url: https://api.domain.com.au/sandbox/
  description: Sandbox
tags:
- name: Webhooks
paths:
  /v1/subscriptions/{id}:
    get:
      tags:
      - Webhooks
      summary: Retrieve the details of a single subscription
      operationId: Webhooks_GetSubscription
      parameters:
      - name: id
        in: path
        description: Subscription identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhooks.v1.WebhookSubscription'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - apikey: []
      - oauth2:
        - api_webhooks_write
      x-domain-endpointcost: 1
      x-domain-usercontextrequired: false
      x-domain-environment: Any
    delete:
      tags:
      - Webhooks
      summary: Delete a single subscription
      operationId: Webhooks_DeleteSubscription
      parameters:
      - name: id
        in: path
        description: Subscription identifier
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - apikey: []
      - oauth2:
        - api_webhooks_write
      x-domain-endpointcost: 1
      x-domain-usercontextrequired: false
      x-domain-environment: Any
    servers:
    - url: https://api.domain.com.au/
      description: Primary
    - url: https://api.domain.com.au/sandbox/
      description: Sandbox
  /v1/webhooks/{id}/subscriptions:
    get:
      tags:
      - Webhooks
      summary: List all subscriptions to the specified webhook
      operationId: Webhooks_ListSubscriptions
      parameters:
      - name: id
        in: path
        description: Subscriber (Webhook) ID
        required: true
        schema:
          type: string
      - name: pageNumber
        in: query
        description: ''
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        description: ''
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Webhooks.v1.WebhookSubscription'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - apikey: []
      - oauth2:
        - api_webhooks_write
      x-domain-endpointcost: 1
      x-domain-usercontextrequired: false
      x-domain-environment: Any
    put:
      tags:
      - Webhooks
      summary: Create a subscription to notifications
      operationId: Webhooks_CreateSubscription
      parameters:
      - name: id
        in: path
        description: Subscriber (Webhook) Id
        required: true
        schema:
          type: string
      requestBody:
        description: New Subscription Details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Webhooks.v1.AddSubscriptionRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/Webhooks.v1.AddSubscriptionRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Webhooks.v1.AddSubscriptionRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhooks.v1.WebhookSubscription'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhooks.v1.WebhookSubscription'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - apikey: []
      - oauth2:
        - api_webhooks_write
      x-domain-endpointcost: 1
      x-domain-usercontextrequired: true
      x-domain-environment: Any
    servers:
    - url: https://api.domain.com.au/
      description: Primary
    - url: https://api.domain.com.au/sandbox/
      description: Sandbox
