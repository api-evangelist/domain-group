openapi: 3.2.0
info:
  title: Domain Group Dataset API
  contact:
    name: Domain Developer Support
    email: api@domain.com.au
  termsOfService: https://developer.domain.com.au/docs/latest/support/terms
  version: '1.0'
  description: 'Operations tagged Dataset across 2 of this provider''s published API definitions: domain-group-openapi-latest.json, domain-group-openapi-v2.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.domain.com.au/
  description: Primary
- url: https://api.domain.com.au/sandbox/
  description: Sandbox
tags:
- name: Dataset
paths:
  /v2/dataset/{datasetName}/{key}:
    get:
      tags:
      - Dataset
      summary: Get a value of a given key for a dataset
      operationId: dataset_get
      parameters:
      - name: datasetName
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: key
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Request successfull. Responds with the value of the key of the dataset from the latest uploaded data
        '400':
          description: Dataset/Uploads/backing resources not found
        '401':
          description: Request is Unauthorized
        '500':
          description: Internal server error
      security:
      - apikey: []
      - oauth2:
        - api_dataset_read
      x-domain-endpointcost: 1
      x-domain-usercontextrequired: false
      x-domain-environment: Any
    servers:
    - url: https://api.domain.com.au/
      description: Primary
    - url: https://api.domain.com.au/sandbox/
      description: Sandbox
