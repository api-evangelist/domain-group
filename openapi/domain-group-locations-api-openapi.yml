openapi: 3.2.0
info:
  title: Domain Group Locations API
  contact:
    name: Domain Developer Support
    email: api@domain.com.au
  termsOfService: https://developer.domain.com.au/docs/latest/support/terms
  version: '1.0'
  description: 'Operations tagged Locations across 2 of this provider''s published API definitions: domain-group-openapi-latest.json, domain-group-openapi-v1.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.domain.com.au/
  description: Primary
- url: https://api.domain.com.au/sandbox/
  description: Sandbox
tags:
- name: Locations
paths:
  /v1/locations/profiles/{domainLocationId}:
    get:
      tags:
      - Locations
      summary: Get location data based on the given domainLocationId
      operationId: LocationProfiles_Get
      parameters:
      - name: domainLocationId
        in: path
        description: ''
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain.LocationProfilesService.v1.Model.Location'
            text/json:
              schema:
                $ref: '#/components/schemas/Domain.LocationProfilesService.v1.Model.Location'
            text/html:
              schema:
                $ref: '#/components/schemas/Domain.LocationProfilesService.v1.Model.Location'
            application/xml:
              schema:
                $ref: '#/components/schemas/Domain.LocationProfilesService.v1.Model.Location'
            text/xml:
              schema:
                $ref: '#/components/schemas/Domain.LocationProfilesService.v1.Model.Location'
        '401':
          description: Unauthorised
        '404':
          description: Not Found
      security:
      - apikey: []
      - oauth2:
        - api_locations_read
      x-domain-usercontextrequired: false
      x-domain-endpointcost: 1
      x-domain-environment: Any
    servers:
    - url: https://api.domain.com.au/
      description: Primary
    - url: https://api.domain.com.au/sandbox/
      description: Sandbox
