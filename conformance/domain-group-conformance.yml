method: derived
source: >-
  openapi/domain-group-openapi-latest.json, openapi/domain-group-openapi-v1.json,
  openapi/domain-group-openapi-v2.json, well-known/domain-group-openid-configuration.json,
  https://developer.domain.com.au/docs/latest/conventions
summary: >-
  Domain conforms to the mainstream web-API standards stack - OpenAPI 3.0.4,
  OAuth 2.0, OpenID Connect with PKCE/PAR/CIBA/DPoP advertised on the auth host,
  and an RFC 7807 ProblemDetails error shape on some responses. It conforms to no
  real-estate-industry data standard: there is no RESO Web API or Data Dictionary
  certification, no OData $metadata, no MLS/IDX surface, and no Universal
  Property Identifier - RESO is a North American NAR-driven programme with no
  presence in the Australian portal duopoly.

standards:
