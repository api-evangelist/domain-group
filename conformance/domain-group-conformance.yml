compliance_program:
  published: false
  note: >-
    No trust centre, no named certification (SOC 2 / ISO 27001 / PCI DSS /
    HIPAA / FedRAMP / IRAP), and no vulnerability-disclosure or bug-bounty
    programme could be verified on any Domain host. probe-security-programs.py
    returned vdp=none trust=none. Accordingly this repo emits no `Compliance` and
    no `Security` pointer - the underlying programmes are not published.
  probes:
