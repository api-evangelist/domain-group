actions:
  openapiHarvested: true
  specsSaved:
    - openapi/domain-group-openapi-latest.json
    - openapi/domain-group-openapi-v1.json
    - openapi/domain-group-openapi-v2.json
  wellKnownSaved:
    - well-known/domain-group-openid-configuration.json
  apisYmlCreated: true
  reason: |
    Domain Group publishes three real, downloadable, valid OpenAPI 3.0.4
    documents and an anonymous OpenID Connect discovery document. All four were
    fetched anonymously at HTTP 200 on 2026-07-26 and saved verbatim with their
    source URLs recorded above. Thirteen documented API packages are listed in
    apis.yml with their real package documentation URLs and the verified
    production base URL https://api.domain.com.au. Nothing was invented: no
    RESO certification, no OData endpoint, no UPI, no SDK, no Postman
    collection, and no open dataset is claimed, because none exists.
